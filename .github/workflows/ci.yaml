name: CI Workflow

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # FRONTEND PIPELINE: Lint & Vite Build
  # ==========================================
  frontend-check:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vite Build Check
        run: npm run build

  # ==========================================
  # BACKEND PIPELINE: Lint & PostgreSQL Tests
  # ==========================================
  backend-check:
    name: Backend (Lint & Database Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    # Database Service Container for Node tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: "test_password"
          POSTGRES_DB: task_dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d task_dashboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Seed Script
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test_user
          DB_PASSWORD: "test_password"
          DB_NAME: task_dashboard_test
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/task_dashboard_test"
          JWT_SECRET: ci_test_secret_12345
        run: npm run seed || true

      - name: Execute API Integration Tests
        env:
          NODE_ENV: test
          PORT: 5000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test_user
          DB_PASSWORD: "test_password"
          DB_NAME: task_dashboard_test
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/task_dashboard_test"
          JWT_SECRET: ci_test_secret_12345
        run: npm test