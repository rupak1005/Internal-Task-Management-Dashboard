version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: task_dashboard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: task_dashboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Node.js & Express REST Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task_dashboard_backend
    restart: unless-stopped
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/task_dashboard
      JWT_SECRET: supersecret_task_dashboard_jwt_key_2026
      NODE_ENV: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. React Frontend (Nginx Production Server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task_dashboard_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
